[workspace]
resolver = "2"
members = ["crates/client-core", "crates/tdlib-bridge", "apps/telerust"]
default-members = ["crates/client-core", "crates/tdlib-bridge", "apps/telerust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "GPL-3.0-or-later"
authors = ["Telerust contributors"]

[workspace.dependencies]
async-channel = "2.5"
gtk = { package = "gtk4", version = "=0.10.1", features = ["gnome_45"] }
adw = { package = "libadwaita", version = "=0.8.0", features = ["v1_5"] }
getrandom = "0.3"
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
